<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A5C4E" />
  <meta name="description"
    content="Higgins Helper — Clark University daily calorie tracker and AI nutritionist for Higgins and The Bistro" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Higgins Helper" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <title>Higgins Helper — Clark Dining Tracker</title>

</head>

<body>
  <div id="root">
    <style>
      .splash-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #09090f;
        color: #fff;
        font-family: system-ui, sans-serif;
        gap: 1rem;
      }

      .splash-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(20, 160, 133, 0.3);
        border-top-color: #14A085;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="splash-loader">
      <div class="splash-spinner"></div>
      <div style="font-weight:600; font-size:1.1rem; letter-spacing:0.05em;">Higgins Helper</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
